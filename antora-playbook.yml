site:
  title: userdata.cloud Docs
  url: https://docs.userdata.cloud
  start_page: home::index.adoc
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://docs.userdata.cloud/sitemap.xml
  keys:
    header_logo: logo.svg
    favicon: favicon.svg
    site_home_url: https://userdata.cloud/
    site_home_label: userdata.cloud home
    schema_org_name: userdata.cloud
    schema_org_url: https://userdata.cloud/
    header_doc_title: userdata.cloud Docs
urls:
  html_extension_style: indexify
antora:
  extensions:
    - require: '@antora-supplemental/facto-stack'
      profile: hub
      # @antora-supplemental/related-docs. One other site, so the banner links straight to it.
      relatedDocs:
        direct_link_when_single: true
        sites:
          - name: Team docs
            url: https://team.docs.userdata.cloud/
            audience: team
            requires_login: true
            login_note: Cloudflare Access for members of the userdata-cloud GitHub organization
            description: Member-only market plan. Those pages stay on the team site.
      siteNavTree:
        enabled: true
        include:
          - home
          - vault
        order:
          - home
          - vault
asciidoc:
  attributes:
    stem: latexmath
content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs
    - url: https://github.com/userdata-cloud/userdata-cloud.git
      branches: HEAD
      start_path: docs
ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v4.3.3/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./build/site
